name = "unicfilm-relay"
main = "worker.js"
compatibility_date = "2026-01-01"

# Preencha com os IDs criados via wrangler (ver README.md).
[[d1_databases]]
binding = "DB"
database_name = "unicfilm-db"
database_id = "f49c4a5f-8e1e-47e7-984c-eda6ab549255"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "unicfilm-media"

[durable_objects]
bindings = [{ name = "ROOM", class_name = "TeamRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TeamRoom"]
