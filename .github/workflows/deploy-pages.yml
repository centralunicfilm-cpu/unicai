# Demo web do protótipo no GitHub Pages.
# ATENÇÃO: build de demonstração SEM a key da Runware (geração de imagem/vídeo
# fica desativada na demo). Nunca exponha VITE_RUNWARE_API_KEY num repo/site público:
# ela vai embutida no JS e qualquer um pode extrair e gastar seus créditos.
name: Deploy demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_RUNWARE_API_KEY: ""
          # Chaves públicas do Supabase (publishable/anon — feitas para ir no frontend).
          # Sem elas o client estoura no boot e a demo abre em tela preta.
          VITE_SUPABASE_URL: "https://ihexxwbejnjaawosgiby.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloZXh4d2Jlam5qYWF3b3NnaWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2MDA2NjcsImV4cCI6MjA4NzE3NjY2N30.NHMvYvIzYtbWRc3adH4mQfOarCMrvkaWjr0NwLPLD1E"
          VITE_SUPABASE_PROJECT_ID: "ihexxwbejnjaawosgiby"
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
